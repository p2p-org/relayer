name: TESTING - gaia to gaia integration

on: [push]

jobs:

  build:
    name: build
    runs-on: ubuntu-latest
    steps:

    # Install and setup go
    - name: Set up Go 1.14
      uses: actions/setup-go@0caeaed6fd66a828038c2da3c0f662a42862658f # v1
      with:
        go-version: 1.14
      id: go

    # checkout relayer
    - name: checkout relayer
      uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2

    # build cache
    - uses: actions/cache@f5ce41475b483ad7581884324a6eca9f48f8dcc7 # v1
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    
    # run tests
    - name: run gaia tests
      run: TEST_DEBUG=true make test-gaia
